name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag must match package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Single-file program
        shell: bash
        run: |
          npm run build:exe
          version="$(node -p "require('./package.json').version")"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then cp dist/xsnium.exe "out/xsnium-$version-${{ matrix.name }}.exe"; else cp dist/xsnium "out/xsnium-$version-${{ matrix.name }}"; fi
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run build:installer -- --skip-exe
          cp dist/xsnium-*-setup.exe out/
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "XSNium ${GITHUB_REF_NAME#v}" --generate-notes $flags
