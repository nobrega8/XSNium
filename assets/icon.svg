<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8a3ffc"/>
      <stop offset="0.55" stop-color="#5a1fc9"/>
      <stop offset="1" stop-color="#2a0f6b"/>
    </linearGradient>
    <linearGradient id="x1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3d4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>
  <!-- orbits: the "-ium" of an element -->
  <g fill="none" stroke="#d9c2ff" stroke-opacity="0.55" stroke-width="5">
    <ellipse cx="128" cy="128" rx="104" ry="40" transform="rotate(-32 128 128)"/>
    <ellipse cx="128" cy="128" rx="104" ry="40" transform="rotate(32 128 128)"/>
  </g>
  <!-- the X: two strokes; one is a form field's caret, one is the pen -->
  <path d="M84 78L172 178" stroke="url(#x1)" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M172 78L84 178" stroke="url(#x1)" stroke-width="30" stroke-linecap="round" fill="none"/>
  <!-- cursor bar under the X: a field being filled in -->
  <rect x="74" y="206" width="100" height="12" rx="6" fill="#ff5ecb"/>
  <rect x="164" y="190" width="11" height="34" rx="5.5" fill="#ff5ecb"/>
  <circle cx="200" cy="66" r="13" fill="#ff5ecb"/>
</svg>
